<button class="modal-overlay" (click)="onClose()">
  <button class="modal-content" (click)="$event.stopPropagation()">
    <byf-close-btn bgColor="var(--color-light)" svgColor="var(--color-dark)" (closed)="onClose()" />
    @if (headerTemplate) {
      <div class="modal-header">
        <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
      </div>
    }

    @if (bodyTemplate) {
      <div class="modal-body">
        <ng-container *ngTemplateOutlet="bodyTemplate"></ng-container>
      </div>
    }

    @if (footerTemplate) {
      <div class="modal-footer">
        <ng-container *ngTemplateOutlet="footerTemplate"></ng-container>
      </div>
    }
  </button>
</button>
