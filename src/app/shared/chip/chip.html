<span
  class="chip"
  [class.chip-green]="chipType() === ChipType.Green"
  [class.chip-pink]="chipType() === ChipType.Pink"
  [class.chip-blue]="chipType() === ChipType.Blue"
  [class.chip-orange]="chipType() === ChipType.Orange"
>
  @if (icon()) {
    <mat-icon class="chip-icon">{{ icon() }}</mat-icon>
  }
  {{ text() }}</span
>
