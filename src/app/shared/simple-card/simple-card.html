<button class="card" (click)="onClick()">
  <div class="card-image">
    <img [src]="image()" [alt]="title()" />
  </div>
  <div class="card-content">
    <div class="flex-1">
      <h3 class="m-0 mb-2 text-sm font-semibold text-dark leading-tight">{{ title() }}</h3>
      <p class="m-0 text-sm text-grey-primary leading-relaxed">{{ subtitle() }}</p>
    </div>
    <div class="card-chip">
      <byf-chip [text]="chips()![0]" [chipType]="ChipType.Orange"></byf-chip>
    </div>
  </div>
</button>
