<div class="login-wrapper">
  <div class="login-card">
    <img class="w-[120px] h-auto mb-2 mx-auto" src="/assets/logo.png" alt="Logo" />
    <h1 class="brand-title">BeYourFitness</h1>
    <h2 class="text-xl font-medium mb-6 text-grey-primary">Iniciar sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Usuario</mat-label>
        <input matInput type="text" formControlName="username" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password" required />
      </mat-form-field>

      <div class="text-right mb-6">
        <a class="forgot-link" (click)="onForgotPassword()">¿Olvidaste tu contraseña?</a>
      </div>

      @if (loginForm.hasError('invalidCredentials')) {
        <mat-error class="mx-4 my-4"> Usuario o contraseña incorrectos. </mat-error>
      }

      <div class="button-group">
        <button mat-flat-button class="login-btn-primary" type="submit">Acceder</button>
        <button mat-stroked-button class="login-btn-accent" routerLink="/register">
          Registrarse
        </button>
      </div>
    </form>
  </div>
</div>
