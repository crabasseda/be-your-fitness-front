<div class="exercise-routine-card bg-white rounded-xl shadow-md overflow-hidden">
  <div class="exercise-header relative">
    <div class="relative h-32 bg-linear-to-br from-blue-500 to-blue-700 overflow-hidden">
      @if (exercise().imageUrl) {
        <img
          [src]="exercise().imageUrl"
          [alt]="exercise().name"
          class="w-full h-full object-cover opacity-80"
        />
      }
      <div class="absolute inset-0 bg-linear-to-t from-black/60 to-transparent"></div>
    </div>

    <div class="absolute bottom-0 left-0 right-0 p-4">
      <h3 class="text-white text-xl font-bold drop-shadow-lg">
        {{ exercise().name }}
      </h3>
      @if (exercise().exerciseType) {
        <p class="text-white/90 text-sm mt-1">{{ exercise().exerciseType }}</p>
      }
    </div>
  </div>

  <div class="p-3 sm:p-6">
    <div
      class="sets-grid-header grid gap-2 sm:gap-4 pb-2 sm:pb-3 border-b-2 border-gray-200 font-semibold text-gray-700 text-xs sm:text-sm"
    >
      <div class="text-center">SET</div>
      <div class="text-center">KG</div>
      <div class="text-center">REPS</div>
      <div class="w-7 sm:w-8"></div>
    </div>

    <div class="sets-grid-body mt-2 space-y-1 sm:space-y-2">
      @for (set of sets(); track set.set_number) {
        <div
          class="sets-grid-row grid gap-2 sm:gap-4 items-center py-2 sm:py-3 hover:bg-gray-50 rounded-lg transition-colors duration-150"
        >
          <div class="flex items-center justify-center">
            <div
              class="w-7 h-7 sm:w-10 sm:h-10 bg-blue-500 text-white rounded-full flex items-center justify-center font-bold text-sm sm:text-lg"
            >
              {{ set.set_number }}
            </div>
          </div>

          <div class="flex items-center justify-center">
            <input
              type="number"
              [value]="set.weight"
              (input)="updateWeight(set.set_number, +$any($event.target).value)"
              placeholder="0"
              min="0"
              step="0.5"
              class="w-16 sm:w-20 px-2 py-1.5 sm:py-2 text-center text-sm sm:text-lg font-semibold bg-transparent border-0 focus:outline-none focus:bg-gray-100 rounded transition-all duration-200"
            />
          </div>

          <div class="flex items-center justify-center">
            <input
              type="number"
              [value]="set.repetitions"
              (input)="updateReps(set.set_number, +$any($event.target).value)"
              placeholder="0"
              min="1"
              max="100"
              class="w-16 sm:w-20 px-2 py-1.5 sm:py-2 text-center text-sm sm:text-lg font-semibold bg-transparent border-0 focus:outline-none focus:bg-gray-100 rounded transition-all duration-200"
            />
          </div>
          <div class="flex items-center justify-center">
            @if (sets().length > 1) {
              <button
                class="text-red-500 hover:text-red-700 rounded-full transition-all duration-200 hover:scale-110 p-1"
                (click)="removeSet(set.set_number)"
                aria-label="Eliminar set"
              >
                <mat-icon class="text-xl! sm:text-2xl!">delete_outline</mat-icon>
              </button>
            }
          </div>
        </div>
      }
    </div>

    <div class="mt-4 sm:mt-6 pt-3 sm:pt-4 border-t-2 border-gray-200">
      <button
        class="w-full flex items-center justify-center gap-2 px-4 sm:px-6 py-2.5 sm:py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold text-sm sm:text-base rounded-lg transition-all duration-200 hover:shadow-lg active:scale-98"
        (click)="addSet()"
      >
        <mat-icon class="text-lg! sm:text-xl! w-5!">add_circle_outline</mat-icon>
        <span>Añadir set</span>
      </button>
    </div>
  </div>
</div>
