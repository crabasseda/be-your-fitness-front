@if (showSearchbar()) {
  <div class="w-full mb-4">
    <byf-searchbar (searchChange)="onSearch($event)"></byf-searchbar>
  </div>
}

@if (showFilters()) {
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
    <byf-filter-dropdown
      [options]="equipmentOptions()"
      label="Equipamiento"
      placeholder="Selecciona"
      [selectedValue]="selectedEquipment()"
      (selectionChanged)="onEquipmentChange($event)"
    />
    <byf-filter-dropdown
      [options]="bodyPartsOptions()"
      label="Parte del cuerpo"
      placeholder="Selecciona"
      [selectedValue]="selectedBodyPart()"
      (selectionChanged)="onBodyPartChange($event)"
    />
  </div>
}

@if (isSelectionMode() && showSelectionChip()) {
  <byf-chip
    [text]="selectedCount().toString() + ' ejercicios seleccionados'"
    [chipType]="ChipType.Blue"
  ></byf-chip>
}

<div
  class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-6 w-full mt-6"
>
  @for (exercise of filteredExercises(); track exercise.exerciseId) {
    <button
      type="button"
      class="relative cursor-pointer transition-all duration-300 rounded-lg hover:-translate-y-1 exercise-card-wrapper"
      [class.selected]="isSelectionMode() && isExerciseSelected(exercise)"
      (click)="onExerciseClick(exercise)"
    >
      <byf-card
        [title]="exercise.name"
        [subtitle]="exercise.exerciseType"
        [chips]="exercise.equipments"
        [image]="exercise.imageUrl"
        [class.card-selected]="isSelectionMode() && isExerciseSelected(exercise)"
      ></byf-card>

      @if (isSelectionMode()) {
        <div class="hidden">
          <mat-checkbox
            [checked]="isExerciseSelected(exercise)"
            (click)="$event.stopPropagation()"
            (change)="toggleExerciseSelection(exercise.exerciseId)"
            color="primary"
            class="exercise-checkbox"
          />
        </div>

        @if (isExerciseSelected(exercise)) {
          <div
            class="absolute top-3 right-3 z-10 bg-green-500 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-[0_3px_12px_rgba(43,159,96,0.5)] animate-scaleIn"
          >
            <mat-icon>check_circle</mat-icon>
          </div>
        }
      }
    </button>
  } @empty {
    <div class="col-span-full text-center py-16 px-8">
      <mat-icon class="text-[5rem]! w-20! h-20! text-gray-600 opacity-30 mb-6">search_off</mat-icon>
      <p class="text-2xl font-semibold text-gray-900 mb-3">No se encontraron ejercicios</p>
      <p class="text-lg text-gray-600">Intenta ajustar los filtros de búsqueda</p>
    </div>
  }
</div>
