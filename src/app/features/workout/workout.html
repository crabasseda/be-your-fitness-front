<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
  <div class="flex justify-end gap-3">
    <button
      mat-stroked-button
      type="button"
      (click)="cancelWorkout()"
      class="border-2! border-(--orange-primary)! text-(--orange-primary)! hover:bg-(--orange-primary)! hover:text-white! font-semibold! py-2.5! px-3 sm:px-5! rounded-lg! transition-all! duration-200!"
    >
      <div class="flex items-center justify-center gap-2">
        <mat-icon class="text-xl">close</mat-icon>
        <span class="hidden sm:inline whitespace-nowrap">Cancelar</span>
      </div>
    </button>

    <button
      mat-flat-button
      type="button"
      (click)="showConfirmationModal.set(true)"
      class="bg-(--orange-primary)! hover:bg-(--orange-secondary)! text-white! font-semibold! py-2.5! px-3 sm:px-5! rounded-lg! shadow-md! hover:shadow-lg! transition-all! duration-200!"
    >
      <div class="flex items-center justify-center gap-2">
        <mat-icon class="text-xl">check</mat-icon>
        <span class="hidden sm:inline whitespace-nowrap">Terminar rutina</span>
      </div>
    </button>
  </div>
  <div class="mb-8">
    <h1 class="font-bold text-3xl md:text-4xl lg:text-5xl text-blue-secondary mb-3">
      {{ workoutRoutine()!.name }}
    </h1>

    <div class="inline-flex items-center gap-2 text-grey-primary">
      <mat-icon class="text-blue-primary w-5! h-5! text-xl!">schedule</mat-icon>
      <span class="font-medium text-base sm:text-lg">
        {{ durationTime() }}
      </span>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in">
    @for (exercise of workoutExercises(); track exercise.exercise_id) {
      <div class="transform transition-all duration-300 hover:scale-[1.02]">
        <routine-exercise-card
          mode="workout"
          [exercise]="exercise"
          [initialSets]="exercise.sets"
          (exerciseUpdated)="handleUpdateExercise($event)"
        />
      </div>
    }
  </div>
</div>

<confirmation-modal
  [isOpen]="showConfirmationModal()"
  [title]="'Terminar rutina'"
  [message]="'¿Estás seguro de que deseas finalizar el entreno?'"
  [confirmText]="'Terminar'"
  [cancelText]="'Cancelar'"
  [icon]="'flag'"
  [type]="'success'"
  (confirm)="finishWorkout()"
  (cancel)="showConfirmationModal.set(false)"
/>
