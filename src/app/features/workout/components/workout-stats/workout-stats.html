<div class="max-w-full">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
    <h2 class="text-xl md:text-2xl font-semibold text-gray-800 m-0">
      📊 Estadísticas de Entrenamiento
    </h2>

    <div class="period-selector">
      <mat-button-toggle-group [value]="selectedPeriod()" (change)="changePeriod($event.value)">
        <mat-button-toggle [value]="7">7 días</mat-button-toggle>
        <mat-button-toggle [value]="30">30 días</mat-button-toggle>
        <mat-button-toggle [value]="90">90 días</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </div>

  <div class="flex flex-wrap gap-2 mb-4">
    <button
      class="metric-button"
      [class.active]="selectedMetric() === ChartMetric.Duration"
      (click)="changeMetric(ChartMetric.Duration)"
    >
      <mat-icon>schedule</mat-icon>
      <span>Duración</span>
    </button>

    <button
      class="metric-button"
      [class.active]="selectedMetric() === ChartMetric.Volume"
      (click)="changeMetric(ChartMetric.Volume)"
    >
      <mat-icon>fitness_center</mat-icon>
      <span>Volumen</span>
    </button>

    <button
      class="metric-button"
      [class.active]="selectedMetric() === ChartMetric.Repetitions"
      (click)="changeMetric(ChartMetric.Repetitions)"
    >
      <mat-icon>format_list_numbered</mat-icon>
      <span>Repeticiones</span>
    </button>
  </div>

  <div class="flex flex-wrap gap-2 mb-6">
    <byf-chip
      [text]="summary().total + ' ' + metricConfig().unit + ' totales'"
      [chipType]="ChipType.Blue"
      [icon]="'trending_up'"
    />

    <byf-chip
      [text]="summary().average + ' ' + metricConfig().unit + ' promedio'"
      [chipType]="ChipType.Green"
      [icon]="'show_chart'"
    />

    <byf-chip
      [text]="summary().max + ' ' + metricConfig().unit + ' máximo'"
      [chipType]="ChipType.Orange"
      [icon]="'whatshot'"
    />

    <byf-chip
      [text]="summary().activeDays + ' días activos'"
      [chipType]="ChipType.Pink"
      [icon]="'event_available'"
    />
  </div>

  @if (isLoading()) {
    <div class="flex flex-col items-center justify-center py-12 text-gray-400">
      <mat-icon class="w-12! h-12! text-[48px]! mb-4!">hourglass_empty</mat-icon>
      <p>Cargando estadísticas...</p>
    </div>
  } @else {
    <div class="bg-white rounded-xl p-4 md:p-6 shadow-sm" style="height: 400px">
      <canvas baseChart [data]="chartData()" [options]="chartOptions" [type]="chartType"> </canvas>
    </div>
  }
</div>
