<div class="min-h-screen bg-gray-50 p-4 md:p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    <div class="flex justify-center">
      <header class="bg-white rounded-2xl p-6 md:p-8 shadow-md">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div class="flex items-center gap-4">
            <div class="w-20 h-20 hero-gradient rounded-full flex items-center justify-center">
              <mat-icon class="w-10! h-10! text-[40px]! text-white">person</mat-icon>
            </div>

            <div>
              <div class="flex justify-between">
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 m-0">
                  {{ user?.name }}
                </h1>
                <mat-icon class="text-(--grey-primary)">settings</mat-icon>
              </div>
              <p class="text-gray-600 text-sm md:text-base mt-1">
                Personal trainer {{ user?.trainer_id }}
              </p>
            </div>
          </div>
        </div>
      </header>
    </div>

    <section>
      <mat-card class="rounded-2xl! shadow-md!">
        <mat-card-content class="p-4! md:p-6!">
          <workout-stats />
        </mat-card-content>
      </mat-card>
    </section>

    <section>
      <mat-card class="rounded-2xl! shadow-md!">
        <mat-card-content class="p-4! md:p-6!">
          <workout-calendar
            [calendarData]="calendarData()"
            (monthChanged)="onMonthChanged($event)"
          />
        </mat-card-content>
      </mat-card>
    </section>

    @if (workoutStats()?.total_workouts === 0) {
      <div class="bg-white rounded-2xl shadow-md p-8 md:p-12 text-center">
        <mat-icon class="w-20! h-20! text-[80px]! text-gray-300 mb-4"> fitness_center </mat-icon>
        <h3 class="text-xl md:text-2xl font-semibold text-gray-800 mb-2">
          ¡Comienza tu viaje fitness!
        </h3>
        <p class="text-gray-600 mb-6">Crea tu primera rutina y registra tu primer entrenamiento</p>
        <button mat-raised-button color="primary" routerLink="/routines" class="rounded-lg!">
          <mat-icon>add</mat-icon>
          Crear Rutina
        </button>
      </div>
    }
  </div>
</div>
