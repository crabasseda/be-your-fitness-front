<div class="profile-container">
  <div class="profile-header">
    <h1>Hola, {{ user!.username || 'Usuario' }} 👋</h1>
    <p class="subtitle">Bienvenido de vuelta</p>
  </div>

  <workout-stats />

  <div class="calendar-section">
    <h2>Calendario de Entrenamientos</h2>

    <div class="bg-gray-50 p-6">
      <workout-calendar
        [calendarData]="calendarData()"
        (monthChanged)="onMonthChanged($event)"
        (workoutClicked)="onWorkoutClicked($event)"
      />
    </div>
  </div>

  @if (workoutStats()?.total_workouts === 0) {
    <div class="empty-state">
      <mat-icon class="empty-icon">fitness_center</mat-icon>
      <h3>¡Empieza tu primer entrenamiento!</h3>
      <p>Crea una rutina y comienza a registrar tus entrenamientos</p>
      <button mat-raised-button color="primary" routerLink="/routines">Ver rutinas</button>
    </div>
  }
</div>
