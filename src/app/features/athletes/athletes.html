<div class="min-h-screen bg-linear-to-br from-light to-white pb-8">
  <div class="bg-linear-to-br from-(--blue-primary) to-(--blue-secondary) px-6 py-8 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-6 flex-wrap">
      <div class="flex-1 min-w-[250px]">
        <h1 class="font-bold text-3xl text-white mb-2 drop-shadow-sm">Atletas asociados</h1>
        <p class="text-white/90">Observa el progreso de los atletas</p>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 mt-6">
    @if (athletes().length > 0) {
      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-6 w-full mt-6"
      >
        @for (athlete of athletes(); track athlete.id) {
          <athlete-card
            [athlete]="athlete"
            [mode]="'view'"
            (cardClicked)="onAthleteClicked($event)"
          />
        }
      </div>
    } @else {
      <div class="bg-white rounded-xl shadow-md p-12 text-center">
        <mat-icon class="w-20! h-20! text-[80px]! text-gray-300 mb-4">group</mat-icon>
        <h3 class="text-2xl font-semibold text-gray-800 mb-2">No tienes atletas</h3>
        <p class="text-gray-600 mb-6">Aún no tienes ningún atleta asignado</p>
      </div>
    }
  </div>
</div>
